<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ターン制バトル試作</title>
<style>
:root{--bg:#f1efe9;--panel:#fff;--ink:#1d2433;--sub:#667085;--line:#d9d5c9;--hp:#3f9d6b;--gauge:#d98a1f;--fire:#d4492f;--water:#2f78c4;--wood:#4a9a49;--light:#c99a1b;--dark:#6a4fb0;--stone:#8a7b5e;--mist:#4f8f95;--star:#d98a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--panel:#1d2540;--ink:#eef0f6;--sub:#9aa3bd;--line:#323c60;--hp:#58c58c;--gauge:#f0a93a;--star:#f0a93a;--light:#e8bf45}}
:root[data-theme="dark"]{--bg:#141a2b;--panel:#1d2540;--ink:#eef0f6;--sub:#9aa3bd;--line:#323c60;--hp:#58c58c;--gauge:#f0a93a;--star:#f0a93a;--light:#e8bf45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:16px 14px 28px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:22px;margin:4px 0 2px;letter-spacing:.04em}
h2{font-size:14px;margin:14px 0 6px}
.lead{margin:0 0 12px;color:var(--sub);font-size:13px}
[hidden]{display:none!important}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.tag{font-size:12px;color:var(--sub);margin:0 0 6px}
.u{position:relative;border:2px solid transparent;border-radius:10px;padding:8px 4px;text-align:center;transition:transform .15s,opacity .3s,border-color .15s}
.u.act{border-color:var(--ink);transform:translateY(-4px)}
.u.dead{opacity:.25}
.u.tgt{border-color:var(--fire)}
.u.guard .face{box-shadow:0 0 0 3px var(--water)}
.u.psn .face{box-shadow:0 0 0 3px var(--dark)}
.u.hurt .face{animation:fl .26s}
.face{width:52px;height:52px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;color:#fff;font-size:22px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700}
.nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:var(--star);letter-spacing:1px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .3s}
.hp i{background:var(--hp)}.gg i{background:var(--gauge);width:0}.xp i{background:var(--water)}
.br{height:5px}.br i{background:var(--dark)}.u.allies .br{display:none}.u.enemies .gg{display:none}
.hpt{font-size:10px;color:var(--sub)}
.intent{font-size:10px;color:var(--sub);min-height:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent.danger{color:var(--fire);font-weight:700}
.pop{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-weight:700;font-size:18px;color:var(--fire);pointer-events:none;animation:rise .8s forwards;white-space:nowrap}
.pop.big{font-size:24px;color:var(--gauge)}.pop.info{color:var(--water);font-size:15px}
@keyframes rise{to{top:-18px;opacity:0}}
@keyframes fl{50%{filter:brightness(2.2)}}
.shake{animation:shk .28s}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
#cut{position:fixed;left:0;right:0;top:38%;padding:14px 12px;text-align:center;color:#fff;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:22px;font-weight:700;letter-spacing:.1em;transform:translateX(120%);pointer-events:none;z-index:5}
#cut.on{animation:cutin .75s ease forwards}
@keyframes cutin{0%{transform:translateX(110%)}20%{transform:translateX(0)}80%{transform:translateX(0);opacity:1}100%{transform:translateX(-110%);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.u{transition:none}.shake,.u.hurt .face{animation:none}#cut{display:none}}
#log{min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
#order{display:flex;gap:4px;align-items:center;margin-bottom:8px;min-height:30px;font-size:11px;color:var(--sub)}
.oc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.oc.cur{box-shadow:0 0 0 2px var(--ink)}.oc.en{outline:2px dashed var(--fire);outline-offset:1px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--gauge);border-color:var(--gauge);color:#1d2433;font-weight:700}
#cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
#cmd button{padding:12px 6px;font-weight:700}
#cmd small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
#end{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;text-align:center;margin:10px 0 8px}
.rc{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rc.in{border-color:var(--gauge);box-shadow:0 0 0 1px var(--gauge)}
.rc .face{margin:0;flex:none}
.rc .info{flex:1;min-width:0;font-size:12px}
.rc .info b{font-size:15px}
.nx{color:var(--sub);font-size:11px}
.bt{display:flex;flex-direction:column;gap:5px}
.bt button{padding:6px 8px;font-size:12px;min-height:36px;white-space:nowrap}
.el{display:inline-block;font-size:10px;line-height:1;padding:2px 4px;border-radius:4px;color:#fff;margin-right:3px;vertical-align:1px}
.rl{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--sub);margin-left:2px}
.stones{font-size:15px;margin:0 0 6px}
.mod{font-size:13px;background:var(--panel);border:1px dashed var(--gauge);border-radius:10px;padding:6px 10px;margin-bottom:10px}
#gres{font-size:13px;margin:6px 0 0;min-height:20px}
</style>
</head>
<body>
<main>
<section id="home">
<h1>育成</h1>
<p class="stones">魂石：<b id="stones">0</b>　／　次の挑戦：ステージ<b id="stg">1</b>　／　所持 <span id="cnt"></span></p>
<div class="ctl" style="align-items:center;margin-bottom:6px"><button id="sPrev" aria-label="前のステージ">◀</button><div id="sTxt" style="flex:1;text-align:center;font-weight:700"></div><button id="sNext" aria-label="次のステージ">▶</button></div>
<div class="mod" id="mod"></div>
<p class="lead" id="ldr"></p>
<div class="ctl"><button id="bGo" class="go">出撃する</button><button id="bGacha">ガチャ 魂石×5</button></div>
<p id="gres"></p>
<h2>編成（3体を選んでください）</h2>
<div id="roster"></div>
<div class="ctl"><button id="bWipe">データを消す</button></div>
</section>

<section id="fight" hidden>
<h1 id="ttl">ステージ1</h1>
<p class="lead" id="fmod"></p>
<div class="field"><p class="tag">敵（下に次の行動と紫の守りバー。0でブレイク）</p><div class="row" id="enemies"></div></div>
<div id="order"></div>
<div id="log">戦闘開始を待っています。</div>
<div id="cmd" hidden>
<button id="cAtk">攻撃<small>気力+15</small></button>
<button id="cSkill">特技<small id="skl">気力50</small></button>
<button id="cGuard">防御<small>被ダメージ60%減・気力+10</small></button>
<button id="cCharge">チャージ<small>気力+40</small></button>
</div>
<div class="field"><p class="tag">味方</p><div class="row" id="allies"></div></div>
<div class="ctl"><button id="bSpeed">速度 ×1</button><button id="bBack">育成へ戻る</button></div>
<p id="end"></p>
<div class="ctl" id="endBtns" hidden><button id="bNext" class="go">もう一度出撃</button><button id="bHome">育成へ</button></div>
</section>
</main>
<div id="cut"></div>
<script>
const MULT=[1,1.35,1.8],COST=[2,4],SK=50,CAP=[20,40,60],XPS=60,PULL=5;
const need=lv=>20+8*lv;
const selStage=()=>Math.min(save.sel||save.stage,save.stage);
const EL={fire:["火","--fire"],water:["水","--water"],wood:["木","--wood"],light:["光","--light"],dark:["闇","--dark"]};
const ADV={fire:"wood",wood:"water",water:"fire"};
const aff=(a,d)=>{if(!a.e||!d.e)return 1;if(a.e!==d.e&&(a.e==="light"||a.e==="dark")&&(d.e==="light"||d.e==="dark"))return 1.5;if(ADV[a.e]===d.e)return 1.5;if(ADV[d.e]===a.e)return .7;return 1};
const RN={tank:"タンク",atk:"アタッカー",support:"サポーター"};
const RD={tank:"HP+25%。防御中は敵の単体攻撃を引き受ける。",atk:"攻撃力+15%。",support:"チャージで味方の気力も+15。"};
const R={atk:{hp:430,atk:70,spd:100},tank:{hp:520,atk:55,spd:85},support:{hp:450,atk:58,spd:110}};
const C=(id,n,g,e,role,sk,S,dsp,ls)=>({id,n,g,e,role,sk,ls,c:EL[e][1],hp:R[role].hp,atk:R[role].atk,spd:R[role].spd+(dsp||0),S:{m:1,all:false,hits:1,...S}});
const CH=[
 C("kai","カイ","剣","fire","tank","烈火斬",{m:1.8,fx:"down",d:"単体攻撃＋敵の攻撃力ダウン"},5,{atkEl:["fire",.25],d:"火属性の味方の攻撃力+25%"}),
 C("akane","アカネ","炎","fire","atk","紅蓮陣",{m:1.1,all:true,d:"敵全体を攻撃"},0,{atkRole:["atk",.2],d:"アタッカーの攻撃力+20%"}),
 C("mina","ミナ","水","water","support","癒しの雫",{m:0,fx:"heal",d:"味方全体を30%回復し攻撃力アップ"},0,{healUp:.5,d:"回復量+50%"}),
 C("nagi","ナギ","波","water","atk","断波",{m:1.4,fx:"breaker",d:"単体攻撃＋守りバーを大きく削る"},8,{spdAll:15,d:"味方全員の速さ+15"}),
 C("rou","ロウ","弓","wood","atk","千枝矢",{m:0.9,hits:3,d:"3連射（ランダムな敵）"},0,{atkEl:["wood",.25],d:"木属性の味方の攻撃力+25%"}),
 C("mori","モリ","樹","wood","tank","大樹の盾",{m:0,fx:"shield",d:"味方全員が防御状態になる"},0,{hpAll:.2,d:"味方全員のHP+20%"}),
 C("lumi","ルミナ","光","light","support","星の奇跡",{m:0,fx:"revive",d:"倒れた味方を復活（いなければ最も傷ついた味方を回復）"},-5,{startGauge:50,d:"戦闘開始時、味方の気力+50"}),
 C("sei","セイ","盾","light","tank","浄化の盾",{m:0,fx:"cleanse",d:"味方の毒・攻撃ダウンを解除し15%回復"},-5,{hpAll:.1,startGauge:20,d:"味方全員のHP+10%・開始時の気力+20"}),
 C("yoru","ヨル","夜","dark","atk","闇喰らい",{m:2.0,fx:"drain",d:"単体攻撃＋与ダメージの半分を自己回復"},-3,{atkEl:["dark",.25],d:"闇属性の味方の攻撃力+25%"}),
 C("tsuki","ツキ","月","dark","support","月の帳",{m:0,fx:"veil",d:"敵全体の攻撃力ダウン＋味方の気力+30"},0,{atkAll:.12,d:"味方全員の攻撃力+12%"})
];
const BYID=Object.fromEntries(CH.map(c=>[c.id,c]));
const sdesc=S=>S.fx==="heal"?"味方全体を回復し攻撃力アップ":S.fx==="boost"?"味方の気力+40・攻撃力アップ":S.all?"敵全体を攻撃":S.hits>1?S.hits+"連続攻撃":S.fx==="down"?"単体攻撃＋攻撃力ダウン":"単体に大ダメージ";
const F=(n,g,e,hp,atk,spd,sk,pat,S)=>({n,g,e,c:e?EL[e][1]:"--stone",hp,atk,spd,sk,pat,S:{m:1,all:false,hits:1,...S}});
const FOES=[
 F("炎狼","炎","fire",520,58,115,"業火の牙",["atk","skill","atk"],{m:1.1,hits:2}),
 F("蒼蛇","蛇","water",500,56,95,"大渦",["heal","atk","skill"],{m:.8,all:true}),
 F("苔の巨人","苔","wood",640,46,80,"根縛り",["poison","atk","skill"],{m:2.0}),
 F("光の獅子","獅","light",560,54,105,"聖光砲",["atk","atk","skill"],{m:1.0,all:true}),
 F("影の獣","影","dark",560,52,105,"闇の咆哮",["atk","atk","skill"],{m:1.0,all:true}),
 F("石の番人","岩",null,720,40,70,"大地砕き",["guard","atk","skill"],{m:2.4}),
 F("霧の亡霊","霧",null,440,60,100,"霧の呪い",["atk","drain","skill"],{m:1.8})
];
const BOSS=F("黒鉄のガロ","王","dark",1500,62,85,"終焉の一撃",["atk","guard","atk","skill"],{m:1.5,all:true});
BOSS.boss=true;
const MODS=["poison","bias","debuff","noheal","bias"];
const modOf=n=>n===1?"none":n%5===0?"boss":MODS[(n-2)%5];
const bEl=n=>Object.keys(EL)[(n*2)%5];
const modText=n=>{const m=modOf(n);return m==="bias"?"属性の偏り："+EL[bEl(n)][0]+"属性の敵だけが出る":{none:"通常のステージ",boss:"ボス戦：全体攻撃に備えよう",poison:"毒の沼：味方が毒状態で始まる",debuff:"弱体の霧：味方が攻撃力ダウンで始まる",noheal:"癒えぬ地：回復が効かない"}[m]};
const LBL={atk:"攻撃",guard:"防御",drain:"気力吸収",heal:"回復",poison:"毒"};
const INTENT=u=>u.stun?"ブレイク中！":"次："+(u.next==="skill"?"大技「"+u.sk+"」":LBL[u.next]);

const KEY="bf-proto-v3";
const fresh=()=>({stones:5,stage:1,party:["kai","mina","rou"],owned:{kai:{star:1,lv:1,exp:0},mina:{star:1,lv:1,exp:0},rou:{star:1,lv:1,exp:0}}});
let save=fresh();
try{
 const s=JSON.parse(localStorage.getItem(KEY)||"null");
 if(s&&s.owned)save=s;
 else{const o=JSON.parse(localStorage.getItem("bf-proto-v2")||"null");
  if(o&&o.stars){save.stones=o.stones;save.stage=o.stage;for(const id of["kai","mina","rou"])save.owned[id]={star:o.stars[id]||1,lv:(o.lv||{})[id]||1,exp:(o.exp||{})[id]||0}}}
}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let units=[],speed=1,run=0,waiting=null,target=null,chain=0,rule="none",lastPull="",LS={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms/speed));
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const stat=(b,s,lv)=>{const k=MULT[s-1]*(1+0.03*((lv||1)-1));return{hp:Math.round(b.hp*k*(b.role==="tank"?1.25:1)),atk:Math.round(b.atk*k*(b.role==="atk"?1.15:1))}};
const badge=e=>e?'<span class="el" style="background:var('+EL[e][1]+')">'+EL[e][0]+'</span>':'';
const pickT=(u,pool)=>{const tk=u.side==="enemies"?pool.find(a=>a.role==="tank"&&a.guard):null;return tk||pick(pool)};
function addExp(id,x){const o=save.owned[id],cap=CAP[o.star-1];if(o.lv>=cap)return false;o.exp+=x;let up=false;while(o.lv<cap&&o.exp>=need(o.lv)){o.exp-=need(o.lv);o.lv++;up=true}if(o.lv>=cap)o.exp=0;return up}
function gainExp(x){let up=false;save.party.forEach(id=>{if(addExp(id,x))up=true});return up}

function pull(){
  if(save.stones<PULL)return;
  save.stones-=PULL;
  const ch=pick(CH),r=Math.random(),star=r<.6?1:r<.9?2:3,o=save.owned[ch.id];
  if(!o){save.owned[ch.id]={star,lv:1,exp:0};lastPull="新キャラ！ "+ch.n+"（"+"★".repeat(star)+"）を獲得"}
  else if(star>o.star){o.star=star;lastPull=ch.n+"が★"+star+"に進化！"}
  else{save.stones+=2;lastPull=ch.n+"が重複。魂石2個に変換"}
  store();showHome();
}
function toggleParty(id){
  const i=save.party.indexOf(id);
  if(i>=0)save.party.splice(i,1);else if(save.party.length<3)save.party.push(id);
  store();showHome();
}
function showHome(){
  run++;waiting=null;
  $("home").hidden=false;$("fight").hidden=true;
  $("stones").textContent=save.stones;$("stg").textContent=save.stage;
  $("cnt").textContent=Object.keys(save.owned).length+"/"+CH.length;
  const sg=selStage();$("mod").textContent="このステージ："+modText(sg);
  $("sTxt").textContent="ステージ"+sg+(sg<save.stage?"（クリア済み・周回）":"（挑戦中）");$("sPrev").disabled=sg<=1;$("sNext").disabled=sg>=save.stage;
  $("bGo").disabled=save.party.length!==3;
  $("bGacha").disabled=save.stones<PULL;
  $("gres").textContent=lastPull;const ld=BYID[save.party[0]];$("ldr").textContent=ld?"リーダー："+ld.n+"（"+ld.ls.d+"）":"";
  const box=$("roster");box.innerHTML="";
  CH.filter(b=>save.owned[b.id]).forEach(b=>{
    const o=save.owned[b.id],s=o.star,lv=o.lv,cap=CAP[s-1],max=s>=3;
    const xpw=lv>=cap?100:Math.round(o.exp/need(lv)*100),cur=stat(b,s,lv),nx=max?null:stat(b,s+1,lv);
    const inP=save.party.includes(b.id);
    const el=document.createElement("div");el.className="rc"+(inP?" in":"");
    el.innerHTML='<div class="face" style="background:var('+b.c+')">'+b.g+'</div><div class="info"><b>'+badge(b.e)+b.n+'</b> <span class="rl">'+RN[b.role]+'</span> <span class="st">'+stars(s)+'</span><br>Lv '+lv+' / '+cap+'　HP '+cur.hp+'　攻撃 '+cur.atk+'　速さ '+b.spd+'<div class="bar xp"><i style="width:'+xpw+'%"></i></div>特技：'+b.sk+'<div class="nx">'+b.S.d+'。'+RD[b.role]+'</div><div class="nx">リーダー：'+b.ls.d+'</div>'+(max?'':'<div class="nx">進化でLv上限'+CAP[s]+'・HP '+nx.hp+'・攻撃 '+nx.atk+'</div>');
    const col=document.createElement("div");col.className="bt";
    const pb=document.createElement("button");pb.textContent=inP?"編成から外す":"編成に入れる";pb.disabled=!inP&&save.party.length>=3;pb.onclick=()=>toggleParty(b.id);
    const ev=document.createElement("button");ev.textContent=max?"最大":"進化 魂石×"+COST[s-1];ev.disabled=max||save.stones<COST[s-1];
    ev.onclick=()=>{save.stones-=COST[s-1];o.star++;store();showHome()};
    const up=document.createElement("button");up.textContent=lv>=cap?"Lv上限":"強化 魂石×1";up.disabled=lv>=cap||save.stones<1;
    up.onclick=()=>{save.stones--;addExp(b.id,XPS);store();showHome()};
    const lb=document.createElement("button");lb.textContent=save.party[0]===b.id?"リーダー":"リーダーにする";lb.disabled=!inP||save.party[0]===b.id;lb.onclick=()=>{save.party=[b.id,...save.party.filter(x=>x!==b.id)];store();showHome()};
    col.append(lb,pb,ev,up);el.appendChild(col);box.appendChild(el);
  });
}
function mk(d,side,star){
  const u={...d,side,max:d.hp,gauge:0,guard:false,star};
  const el=document.createElement("div");el.className="u "+side;
  el.innerHTML='<div class="face" style="background:var('+d.c+')">'+d.g+'</div><div class="nm">'+badge(d.e)+d.n+(star?' <span class="st">'+"★".repeat(star)+'</span>':'')+'</div><div class="bar hp"><i></i></div><div class="hpt"></div><div class="bar br"><i></i></div><div class="bar gg"><i></i></div><div class="intent"></div>';
  u.el=el;u.br=u.brMax=d.boss?10:5;return u;
}
function pickFoes(){
  const sg=selStage(),m=modOf(sg);let r;
  if(m==="bias"){const b=FOES.find(f=>f.e===bEl(sg));r=[0,1,2].map(i=>({...b,n:b.n+["","Ⅱ","Ⅲ"][i],hp:Math.round(b.hp*(i?.85:1))}))}
  else r=FOES.slice().sort(()=>Math.random()-.5).slice(0,3);
  if(m==="boss")r[1]=BOSS;
  return r;
}
function build(){
  units=[];$("allies").innerHTML="";$("enemies").innerHTML="";
  rule=modOf(selStage());
  LS=BYID[save.party[0]].ls||{};
  save.party.forEach(id=>{const b=BYID[id],o=save.owned[id],st=stat(b,o.star,o.lv);const lh=1+(LS.hpAll||0),la=1+(LS.atkAll||0)+(LS.atkEl&&LS.atkEl[0]===b.e?LS.atkEl[1]:0)+(LS.atkRole&&LS.atkRole[0]===b.role?LS.atkRole[1]:0);
    const u=mk({...b,hp:Math.round(st.hp*lh),atk:Math.round(st.atk*la),spd:b.spd+(LS.spdAll||0)},"allies",o.star);u.gauge=LS.startGauge||0;
    if(rule==="poison")u.poison=3;if(rule==="debuff")u.debuff=3;
    $("allies").appendChild(u.el);units.push(u)});
  const k=1+0.2*(selStage()-1);
  pickFoes().forEach(f=>{const u=mk({...f,hp:Math.round(f.hp*k),atk:Math.round(f.atk*k)},"enemies",0);
    u.pi=0;u.next=u.pat[0];u.el.onclick=()=>{if(u.hp>0){target=u;mark()}};
    $("enemies").appendChild(u.el);units.push(u)});
  target=null;chain=0;units.forEach(draw);mark();
}
function draw(u){
  u.gauge=Math.min(100,u.gauge);
  u.el.querySelector(".hp i").style.width=Math.max(0,u.hp)/u.max*100+"%";
  u.el.querySelector(".hpt").textContent=Math.max(0,Math.ceil(u.hp))+" / "+u.max+(u.poison>0?" 毒":"")+(u.buff>0?" 攻↑":"")+(u.debuff>0?" 攻↓":"");
  u.el.querySelector(".gg i").style.width=u.gauge+"%";
  u.el.querySelector(".br i").style.width=u.br/u.brMax*100+"%";
  u.el.classList.toggle("dead",u.hp<=0);
  u.el.classList.toggle("guard",u.guard&&u.hp>0);
  u.el.classList.toggle("psn",u.poison>0&&u.hp>0);
  const it=u.el.querySelector(".intent");
  if(u.side==="enemies"&&u.hp>0){it.textContent=INTENT(u);it.className="intent"+(u.next==="skill"?" danger":"")}else it.textContent="";
}
const alive=s=>units.filter(u=>u.side===s&&u.hp>0);
function tgt(){if(!target||target.hp<=0)target=alive("enemies")[0]||null;return target}
function mark(){const t=tgt();units.forEach(u=>u.el.classList.toggle("tgt",u===t))}
function say(t){$("log").textContent=t}
function pop(u,t,cls){const e=document.createElement("div");e.className="pop "+(cls||"");e.textContent=t;u.el.appendChild(e);setTimeout(()=>e.remove(),800/speed)}
function flash(u){u.el.classList.add("hurt");setTimeout(()=>u.el.classList.remove("hurt"),260/speed)}
function shake(){const f=$("fight");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}
function cut(u){const e=$("cut");e.textContent=u.n+"　"+u.sk;e.style.background="var("+u.c+")";e.style.animationDuration=(0.75/speed)+"s";e.className="";void e.offsetWidth;e.className="on"}
function hit(from,to,m,big){
  const a=aff(from,to);
  const d=Math.round(from.atk*(from.buff>0?1.25:1)*(from.debuff>0?0.75:1)*m*a*rnd(.9,1.1)*(to.guard?.4:1)*(to.stun?1.5:1));
  to.hp-=d;to.gauge+=8;
  if(to.side==="enemies"&&to.hp>0&&!to.stun&&(a>1||big)){to.br-=a>1?2:1;if(to.br<=0){to.br=0;to.stun=true;pop(to,"ブレイク！","big");shake()}}
  pop(to,d+(a>1?" 弱点！":a<1?" 耐性":""),big||a>1?"big":"");draw(to);flash(to);
  if(big||a>1||d>to.max*0.25)shake();return d;
}
function showOrder(ord,cur){const i=ord.indexOf(cur);$("order").innerHTML="<span>行動順</span>"+ord.slice(i).filter(x=>x.hp>0).map((x,j)=>'<span class="oc'+(x.side==="enemies"?" en":"")+(j===0?" cur":"")+'" style="background:var('+x.c+')">'+x.g+'</span>').join("")}
function ask(u){
  return new Promise(res=>{
    waiting=c=>{waiting=null;$("cmd").hidden=true;res(c)};
    $("skl").textContent=u.sk+"（気力"+SK+"）";
    $("cSkill").disabled=u.gauge<SK;
    $("cmd").hidden=false;say(u.n+"の行動を選んでください。");
  });
}
async function turn(u,id){
  const fs=u.side==="allies"?"enemies":"allies";
  if(u.hp<=0||!alive(fs).length)return;
  u.guard=false;
  if(u.poison>0){const pd=Math.round(u.max*0.08);u.hp=Math.max(1,u.hp-pd);u.poison--;pop(u,pd,"info")}
  draw(u);u.el.classList.add("act");
  if(u.stun){say(u.n+"はブレイク状態で動けない！");await sleep(700);if(run!==id)return;u.stun=false;u.br=u.brMax;draw(u);u.el.classList.remove("act");return}
  let c;
  if(u.side==="allies"){c=await ask(u);if(run!==id)return;if(c==="atk"||c==="skill"){chain++;if(chain>1)pop(u,"連携×"+chain,"info")}else chain=0}
  else{c=u.next;chain=0}
  const cm=u.side==="allies"?1+0.2*Math.max(0,chain-1):1;
  if(c==="atk"){
    const pool=alive(fs),t=u.side==="allies"?tgt():pickT(u,pool);
    say(u.n+"の攻撃！");await sleep(400);if(run!==id)return;
    hit(u,t,cm);u.gauge+=15;
  }else if(c==="skill"){
    u.gauge-=SK;say(u.n+"の特技「"+u.sk+"」！");cut(u);await sleep(700);if(run!==id)return;
    const S={...u.S,m:u.S.m*cm};
    if(S.fx==="heal"){alive(u.side).forEach(a=>{if(rule==="noheal")pop(a,"回復不可","info");else{const h=Math.round(a.max*0.3*(1+(u.side==="allies"?(LS.healUp||0):0)));a.hp=Math.min(a.max,a.hp+h);pop(a,"+"+h,"info")}a.buff=3;draw(a)})}
    else if(S.fx==="shield"){alive(u.side).forEach(a=>{a.guard=true;pop(a,"防御","info");draw(a)})}
    else if(S.fx==="cleanse"){alive(u.side).forEach(a=>{a.poison=0;a.debuff=0;if(rule!=="noheal")a.hp=Math.min(a.max,a.hp+Math.round(a.max*0.15));pop(a,"浄化","info");draw(a)})}
    else if(S.fx==="revive"){const dead=units.find(x=>x.side===u.side&&x.hp<=0);if(dead&&rule!=="noheal"){dead.hp=Math.round(dead.max*0.4);dead.gauge=0;pop(dead,"復活！","big");draw(dead)}else{const l=alive(u.side).sort((p,q)=>p.hp/p.max-q.hp/q.max)[0];if(rule==="noheal")pop(l,"回復不可","info");else{const h=Math.round(l.max*0.4);l.hp=Math.min(l.max,l.hp+h);pop(l,"+"+h,"info")}draw(l)}}
    else if(S.fx==="veil"){alive(fs).forEach(f=>{f.debuff=3;pop(f,"攻↓","info");draw(f)});alive(u.side).forEach(a=>{a.gauge+=30;draw(a)})}
    else if(S.all)alive(fs).forEach(f=>hit(u,f,S.m,true));
    else for(let i=0;i<S.hits;i++){
      const pool=alive(fs);if(!pool.length)break;
      const t=(S.hits===1&&u.side==="allies")?tgt():pickT(u,pool);
      const dd=hit(u,t,S.m,true);if(S.fx==="down"){t.debuff=3;draw(t)}
      if(S.fx==="drain"&&rule!=="noheal"){const h=Math.round(dd*.5);u.hp=Math.min(u.max,u.hp+h);pop(u,"+"+h,"info");draw(u)}
      if(S.fx==="breaker"&&t.hp>0&&!t.stun){t.br-=3;if(t.br<=0){t.br=0;t.stun=true;pop(t,"ブレイク！","big");shake()}draw(t)}
      if(S.hits>1){await sleep(250);if(run!==id)return}
    }
  }else if(c==="drain"){
    const t=pickT(u,alive(fs));say(u.n+"の気力吸収！");await sleep(400);if(run!==id)return;
    hit(u,t,0.6);t.gauge=Math.max(0,t.gauge-40);pop(t,"気力-40","info");draw(t);
  }else if(c==="heal"){
    if(rule==="noheal")pop(u,"回復不可","info");else{const h=Math.round(u.max*0.25);u.hp=Math.min(u.max,u.hp+h);pop(u,"+"+h,"info")}
    say(u.n+"は傷を癒やした。");
  }else if(c==="poison"){
    const t=pickT(u,alive(fs));say(u.n+"の毒！");await sleep(400);if(run!==id)return;
    hit(u,t,0.5);t.poison=3;pop(t,"毒","info");draw(t);
  }else if(c==="guard"){
    u.guard=true;u.gauge+=10;say(u.n+"は身を守っている。");pop(u,"防御","info");
  }else{
    u.gauge+=40;if(u.role==="support")alive("allies").forEach(a=>{if(a!==u){a.gauge+=15;draw(a)}});
    say(u.n+"は気力を溜めた。");pop(u,"気力+40","info");
  }
  if(u.buff>0)u.buff--;if(u.debuff>0)u.debuff--;
  if(u.side==="enemies"){u.pi++;u.next=u.pat[u.pi%u.pat.length]}
  draw(u);mark();await sleep(550);if(run!==id)return;
  u.el.classList.remove("act");
}
async function battle(){
  const id=++run;$("end").textContent="";$("endBtns").hidden=true;
  while(run===id&&alive("allies").length&&alive("enemies").length){
    const ord=units.filter(x=>x.hp>0).sort((a,b)=>b.spd-a.spd);
    for(const u of ord){
      if(run!==id)return;
      showOrder(ord,u);await turn(u,id);
      if(!alive("allies").length||!alive("enemies").length)break;
    }
  }
  if(run!==id)return;
  const win=alive("allies").length>0,sg=selStage(),first=sg===save.stage,boss=sg%5===0;
  const xp=win?50+20*sg:25+10*sg,ups=gainExp(xp);
  if(win){const g=first?3+(boss?7:0):1;save.stones+=g;if(first){save.stage++;save.sel=save.stage}$("end").textContent="勝利！ 魂石"+g+"個"+(first&&boss?"（ボス報酬込み）":"")+"・経験値"+xp+(ups?"・レベルアップ！":"");$("bNext").textContent=first?"次のステージへ":"もう一度周回"}
  else{const g=first?1:0;save.stones+=g;$("end").textContent="敗北… 魂石"+g+"個・経験値"+xp+(ups?"・レベルアップ！":"");$("bNext").textContent="もう一度挑戦"}
  store();say("");$("order").innerHTML="";$("endBtns").hidden=false;
}
function start(){
  if(save.party.length!==3)return;
  run++;waiting=null;$("cmd").hidden=true;
  $("home").hidden=true;$("fight").hidden=false;
  $("ttl").textContent="ステージ"+selStage();
  $("fmod").textContent=modText(selStage());
  build();say("戦闘開始！");setTimeout(battle,300);
}
$("bGo").onclick=start;$("bNext").onclick=()=>{lastPull="";start()};
$("bGacha").onclick=pull;$("sPrev").onclick=()=>{save.sel=selStage()-1;store();showHome()};$("sNext").onclick=()=>{save.sel=selStage()+1;store();showHome()};
$("bHome").onclick=showHome;$("bBack").onclick=showHome;
$("bSpeed").onclick=e=>{speed=speed===1?2:1;e.target.textContent="速度 ×"+speed};
$("bWipe").onclick=()=>{if(confirm("育成データを消して最初からにしますか？")){save=fresh();lastPull="";store();showHome()}};
[["cAtk","atk"],["cSkill","skill"],["cGuard","guard"],["cCharge","charge"]].forEach(([i,c])=>$(i).onclick=()=>waiting&&waiting(c));
showHome();
</script>
